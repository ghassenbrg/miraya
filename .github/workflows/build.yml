name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: ${{ vars.MIRAYA_MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        env:
          MIRAYA_XCODE: ${{ vars.MIRAYA_XCODE }}
        run: scripts/ci/select-xcode.sh
      - name: Test sender protocol
        run: swift test --package-path macos
      - name: Test snapshot and production guards
        run: python3 tools/test-release-plan.py
      - name: Package universal app
        env:
          CODESIGN_IDENTITY: '-'
        run: scripts/build-macos.sh --universal
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Miraya.app dist/Miraya-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Miraya-macOS-local-build
          path: dist/Miraya-macOS.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and lint receiver
        run: android/gradlew -p android --no-daemon testDebugUnitTest lintDebug
      - name: Build installable APK and unsigned release
        run: |
          scripts/build-android.sh debug
          scripts/build-android.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: Miraya-TV-APKs
          path: dist/*.apk
